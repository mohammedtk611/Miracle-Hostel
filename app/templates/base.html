<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ app_name }}{% endblock %} | Miracle Hostel Portal</title>

  <!-- Prevent FOUC: Apply user theme preference before rendering -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('miracle_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = savedTheme;
      } catch (e) {}
    })();
  </script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Miracle Portal Custom Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  
  {% block styles %}{% endblock %}
</head>
<body>
  <div class="app-wrapper">
    <!-- Collapsible & Mobile Drawer Sidebar -->
    {% include 'components/sidebar.html' %}

    <!-- Main Content Shell -->
    <div class="app-main">
      <!-- Topbar with Global Branch Selector & User Status -->
      {% include 'components/topbar.html' %}

      <!-- Page Specific Content -->
      <main class="page-container">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- Global Toast / Alert Notifications -->
  {% include 'components/toasts.html' %}

  <!-- Core JavaScript Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  
  {% block scripts %}{% endblock %}
</body>
</html>
