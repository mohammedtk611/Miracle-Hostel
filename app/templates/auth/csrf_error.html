<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Token Error | Miracle Hostel</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background-color: var(--color-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      max-width: 460px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card-portal error-card shadow-sm">
    <div class="card-portal-body p-4 text-center">
      <div class="text-danger mb-3">
        <i class="bi bi-shield-x fs-1"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-2">Security Verification Failed</h1>
      <p class="text-muted small mb-3">
        The request was rejected because the Cross-Site Request Forgery (CSRF) security token was invalid, missing, or has expired.
      </p>
      {% if reason %}
        <div class="alert alert-secondary py-2 small mb-3 font-monospace text-start">
          Details: {{ reason }}
        </div>
      {% endif %}
      <div class="d-grid gap-2">
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
          <i class="bi bi-arrow-left me-1"></i> Return to Sign In
        </a>
      </div>
    </div>
  </div>
</body>
</html>
