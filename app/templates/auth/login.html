<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Administrator Sign In | Miracle Boys Hostel</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  
  <!-- Anti-FOUC Theme Initialization Script -->
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('miracle_theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
  
  <style>
    body {
      background-color: var(--color-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.75rem;
      }
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-brand-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-brand-logo-img {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: contain;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      border: 2px solid var(--color-border);
      background-color: transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .login-brand-logo-img:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }
  </style>
</head>
<body>
  <!-- Theme Switcher Floating Button -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index: 1050;">
    <button class="btn btn-sm btn-outline-secondary theme-toggle-btn rounded-circle d-inline-flex align-items-center justify-content-center" 
            id="themeToggleBtn" 
            type="button" 
            title="Toggle Light/Dark Theme" 
            aria-label="Toggle theme">
      <i class="bi bi-moon-stars-fill theme-icon-dark"></i>
      <i class="bi bi-sun-fill theme-icon-light d-none text-warning"></i>
    </button>
  </div>
  <div class="login-container">
    <div class="login-brand-header">
      <div class="login-brand-logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Miracle Boys Hostel" class="login-brand-logo-img">
      </div>
      <h1 class="h3 fw-bold text-dark mb-1">Miracle Boys Hostel</h1>
      <p class="text-muted small mb-0">Central Administrator Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="card-portal shadow-sm">
      <div class="card-portal-body p-4">
        <!-- Flash Alert Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category if category != 'message' else 'primary' }} alert-dismissible fade show small py-2 px-3 mb-3" role="alert">
                <i class="bi bi-info-circle me-1"></i> {{ message }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
          <!-- CSRF Token -->
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Email Input -->
          <div class="mb-3">
            <label for="email" class="form-label required">Administrator Email / ID</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="bi bi-envelope"></i>
              </span>
              <input 
                type="text" 
                class="form-control border-start-0 ps-0 font-monospace" 
                id="email" 
                name="email" 
                value="{{ email or '' }}" 
                required 
                autofocus
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password Input with Show/Hide Toggle -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="password" class="form-label required mb-0">Password</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-decoration-none">
                Forgot password?
              </a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted">
                <i class="bi bi-shield-lock"></i>
              </span>
              <input 
                type="password" 
                class="form-control border-start-0 border-end-0 ps-0" 
                id="password" 
                name="password" 
                required
                autocomplete="current-password"
              >
              <button 
                class="btn btn-outline-secondary border-start-0 bg-white text-muted px-3" 
                type="button" 
                id="togglePassword" 
                data-toggle="password" 
                data-target="password"
                aria-label="Toggle password visibility"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Sign In Submit Button -->
          <div class="d-grid mt-4 mb-2">
            <button type="submit" class="btn btn-primary py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
            </button>
          </div>
        </form>
      </div>
      
      <div class="card-portal-footer text-center py-3">
        <small class="text-muted">
          Miracle Hostel &bull; Version 1.0
        </small>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
