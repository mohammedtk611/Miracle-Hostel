<!-- Miracle Hostel Topbar Navigation -->
<header class="app-topbar">
  <div class="topbar-left">
    <!-- Mobile Hamburger Button -->
    <button class="btn btn-outline-primary mobile-menu-btn d-lg-none p-2" id="mobileMenuToggle" aria-label="Open Navigation">
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Global Branch Filter Selector -->
    <div class="branch-selector-container">
      <span class="text-muted small fw-semibold d-none d-md-inline">
        Branch:
      </span>
      <select class="form-select form-select-sm topbar-branch-select" id="globalBranchSelect" title="Select Branch Filter">
        <option value="all" {% if request.args.get('branch') == 'all' or not request.args.get('branch') %}selected{% endif %}>
          All Branches
        </option>
        {% for b in header_active_branches %}
          <option value="{{ b.id }}" {% if request.args.get('branch') == (b.id|string) %}selected{% endif %}>
            {{ b.branch_name }} ({{ b.branch_code }})
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="topbar-right">
    <!-- System Status Indicator -->
    <div class="system-status-indicator d-none d-md-inline-flex">
      <span class="status-dot"></span>
      <span>System Active • 30d Retention Active</span>
    </div>

    <!-- Dark / Light Theme Toggle Button -->
    <button class="btn btn-sm btn-outline-secondary theme-toggle-btn d-inline-flex align-items-center justify-content-center p-2 rounded-circle" 
            id="themeToggleBtn" 
            type="button" 
            title="Toggle Light/Dark Theme" 
            aria-label="Toggle theme">
      <i class="bi bi-moon-stars-fill theme-icon-dark"></i>
      <i class="bi bi-sun-fill theme-icon-light d-none text-warning"></i>
    </button>

    <!-- User / Logout Control -->
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-primary dropdown-toggle d-flex align-items-center gap-2" type="button" id="adminMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-sm-inline">{{ current_user.username if current_user.is_authenticated else 'admin' }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="adminMenuDropdown">
        <li>
          <h6 class="dropdown-header">
            {{ current_user.email if current_user.is_authenticated else 'Super Admin' }}
          </h6>
        </li>
        <li>
          <button type="button" class="dropdown-item d-flex align-items-center justify-content-between" id="themeToggleDropdownBtn">
            <span><i class="bi bi-moon-stars me-2 text-muted"></i>Dark Mode</span>
            <span class="badge bg-secondary-subtle text-secondary small theme-mode-label">Off</span>
          </button>
        </li>
        <li>
          <a class="dropdown-item" href="{{ url_for('settings.index') }}">
            <i class="bi bi-gear me-2 text-muted"></i>Settings & Security
          </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right me-2"></i>Sign Out
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
